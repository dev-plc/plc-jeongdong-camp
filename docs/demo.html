<style>
/* ==========================================================================
   PLC 정동 가을캠프 — 신앙탐험대
   브랜드: 붉은벽돌 #984534 / 회색담벼락 #c2c2c2  (docs-dev/brand/BRAND.md)
   모바일 우선. 현장에서 한 손으로 쓰는 화면이 기준이다.
   ========================================================================== */

:root {
  --brick: #984534;
  --brick-dark: #7a3729;
  --brick-light: #b9705f;
  --wall: #c2c2c2;
  --paper: #f6f2ed;
  --paper-2: #fffdfa;
  --ink: #2c2320;
  --ink-2: #6b5d57;
  --line: #e2d9d1;
  --ok: #3f7d5a;
  --warn: #b8863b;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(44, 35, 32, .06), 0 8px 24px rgba(44, 35, 32, .06);
  --font-serif: 'Gowun Batang', 'Nanum Myeongjo', serif;
  --font-sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --appbar-h: 64px;
  --tabbar-h: 62px;
}

* { box-sizing: border-box; }

/* display 를 지정한 요소(.tabbar 의 flex 등)가 [hidden] 을 덮어쓰는 걸 막는다.
   JS 는 el.hidden 으로만 표시를 토글하므로 이 규칙이 없으면 숨김이 먹지 않는다. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

img { max-width: 100%; display: block; }
a { color: var(--brick); }

/* ------------------------------------------------------------------ 앱바 */

.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--brick);
  color: #fff;
  padding-top: env(safe-area-inset-top);
}
.appbar__inner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  max-width: 720px;
  margin: 0 auto;
}
.appbar__mark { width: 30px; height: 30px; opacity: .95; }
.appbar__sub {
  margin: 0;
  font-size: 11px;
  letter-spacing: .08em;
  opacity: .82;
}
.appbar__title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: .01em;
}
.ticker {
  margin: 0;
  padding: 7px 18px;
  background: rgba(0, 0, 0, .16);
  font-size: 13px;
  text-align: center;
}

/* ------------------------------------------------------------------ 레이아웃 */

.view {
  max-width: 720px;
  margin: 0 auto;
  padding: 18px 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom));
}
body.is-auth .view { padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom)); }

.section-head { margin: 4px 2px 14px; }
.section-head h2 {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 20px;
}

.loading, .empty {
  padding: 34px 12px;
  text-align: center;
  color: var(--ink-2);
  font-size: 14px;
}

/* ------------------------------------------------------------------ 히어로 (로그인) */

.hero { padding: 28px 6px 18px; text-align: center; }
.hero__eyebrow { margin: 0 0 8px; font-size: 12px; color: var(--ink-2); letter-spacing: .04em; }
.hero__title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 32px;
  color: var(--brick);
  letter-spacing: .02em;
}
.hero__sub { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }

/* ------------------------------------------------------------------ 카드 */

.card {
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 14px;
}
.card__title {
  margin: 0 0 12px;
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
}
.card__eyebrow { margin: 0 0 4px; font-size: 12px; color: var(--ink-2); }
.card__foot {
  margin: 14px 0 0;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  font-size: 13px;
  color: var(--ink-2);
}
.card--team { border-left: 5px solid var(--team-color, var(--brick)); }
.card--form .field:last-of-type { margin-bottom: 18px; }

.kv { margin: 0; display: grid; gap: 8px; }
.kv > div { display: flex; gap: 12px; font-size: 14px; }
.kv dt { margin: 0; width: 54px; flex: none; color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 500; }

/* ------------------------------------------------------------------ 폼 */

.field { display: block; margin-bottom: 14px; }
.field__label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
}
.field__label em { font-style: normal; opacity: .7; font-weight: 400; }

.input {
  width: 100%;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--ink);
  font-family: inherit;
  font-size: 16px; /* iOS 자동 확대 방지 */
  line-height: 1.5;
}
.input:focus {
  outline: none;
  border-color: var(--brick);
  box-shadow: 0 0 0 3px rgba(152, 69, 52, .12);
}
textarea.input { resize: vertical; min-height: 96px; }

/* 회차는 2개로 정해져 있지 않다 (사전답사 등). 3개부터는 다음 줄로 넘긴다 —
   좁은 화면에서 셋을 한 줄에 욱여넣으면 라벨이 칸 안에서 눌린다. */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg__item { flex: 1 1 140px; position: relative; }
.seg__item input { position: absolute; opacity: 0; pointer-events: none; }
.seg__item span {
  display: block;
  padding: 11px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #fff;
  text-align: center;
  font-size: 14px;
  cursor: pointer;
}
.seg__item span em { display: block; font-style: normal; font-size: 11px; color: var(--ink-2); }
.seg__item input:checked + span {
  border-color: var(--brick);
  background: var(--brick);
  color: #fff;
}
.seg__item input:checked + span em { color: rgba(255, 255, 255, .8); }
.seg__item input:focus-visible + span { box-shadow: 0 0 0 3px rgba(152, 69, 52, .2); }

.check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 12px; }

.filepick {
  display: block;
  padding: 13px;
  border: 1px dashed var(--wall);
  border-radius: var(--radius-sm);
  background: #fff;
  text-align: center;
  font-size: 14px;
  color: var(--ink-2);
  cursor: pointer;
}
.filepick--sm { padding: 9px; font-size: 13px; margin-bottom: 8px; }

/* 촬영 / 갤러리 두 버튼. 좁은 화면에서 라벨이 길면 아래로 넘긴다. */
.filepick-row { display: flex; flex-wrap: wrap; gap: 8px; }
.filepick-row .filepick { flex: 1 1 140px; }

.photo-preview { margin-top: 10px; }
.photo-preview img {
  width: 100%;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  margin-bottom: 8px;
}

.hint { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); }
.hint--center { text-align: center; }

/* ------------------------------------------------------------------ 버튼 */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 16px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  transition: background .12s, border-color .12s, opacity .12s;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn--primary { background: var(--brick); color: #fff; }
.btn--primary:not(:disabled):active { background: var(--brick-dark); }
.btn--ghost { border-color: var(--line); background: #fff; color: var(--ink); }
.btn--ghost:not(:disabled):active { background: #f2ece6; }
.btn--danger { background: #a33; color: #fff; }
.btn--danger-text { color: #a33; }
.btn--block { width: 100%; }
.btn--sm { padding: 8px 12px; font-size: 13px; }

/* ------------------------------------------------------------------ 칩 / 배지 */

.chip {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.6;
  white-space: nowrap;
}
.chip--wait { background: #efe9e3; color: var(--ink-2); }
.chip--here { background: #f6ecd8; color: var(--warn); }
.chip--done { background: #e3efe7; color: var(--ok); }
.chip--reject { background: #f7e3e0; color: #a33; }

.badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--brick);
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  vertical-align: middle;
}

/* ------------------------------------------------------------------ 공지 / 타임라인 */

.notice { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.notice:last-child { border-bottom: 0; padding-bottom: 0; }
.notice:first-child { padding-top: 0; }
.notice h3 { margin: 0 0 4px; font-size: 15px; }
.notice p { margin: 0; font-size: 14px; color: var(--ink-2); }
.notice--pinned h3::before { content: '📌 '; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline__row {
  display: flex;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
}
.timeline__row:last-child { border-bottom: 0; }
.timeline__time {
  flex: none;
  width: 86px;
  font-size: 12.5px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  padding-top: 2px;
}
.timeline__body { font-size: 14.5px; }
.timeline__body em { font-style: normal; font-size: 12.5px; color: var(--ink-2); margin-left: 6px; }
.timeline__note { display: block; font-size: 12px; color: var(--ink-2); }

/* ------------------------------------------------------------------ 코스 */

.cp {
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-left: 5px solid var(--wall);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
}
.cp--here { border-left-color: var(--warn); }
.cp--done { border-left-color: var(--ok); }

.cp__head { display: flex; align-items: flex-start; gap: 11px; }
.cp__head > div { flex: 1; min-width: 0; }
.cp__no {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--brick);
  color: #fff;
  font-size: 13px;
  display: grid;
  place-items: center;
  margin-top: 2px;
}
.cp__name { margin: 0; font-family: var(--font-serif); font-size: 16.5px; }
.cp__sum { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); }
.cp__desc { margin: 12px 0 0; font-size: 14px; }
.cp__mission {
  margin: 10px 0 0;
  padding: 10px 12px;
  background: #f6f0e8;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
}
.cp__mission strong { color: var(--brick); margin-right: 4px; }
.cp__times { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cp__links { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.cp__hours { font-size: 12px; color: var(--ink-2); }
.cp__actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}
.cp__actions .btn { flex: 1; }

/* ------------------------------------------------------------------ 탐험일지 */

/* 탭이 넷 이상(전체 + 회차들)이 될 수 있다. 좁은 화면에서 줄을 바꾼다 — .seg 와 같은 방식(D-026). */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
.tab {
  flex: 1 1 96px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #fff;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--ink-2);
  cursor: pointer;
}
.tab.is-active { background: var(--brick); border-color: var(--brick); color: #fff; }

.grid { display: grid; gap: 12px; }
@media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }

.jcard {
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.jcard--editing { grid-column: 1 / -1; }
.jcard__photo { display: block; }
.jcard__photo img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #eee; }
.jcard__body { padding: 14px; }
.jcard__meta { margin: 0 0 6px; font-size: 12px; color: var(--ink-2); }
.jcard__meta strong { color: var(--ink); font-weight: 500; }
.jcard__text { margin: 0; font-size: 14px; white-space: normal; }
.jcard__reject {
  margin: 8px 0 0;
  font-size: 12.5px;
  color: #a33;
  background: #f9eeec;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
}
.jcard__actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.jcard__role { font-size: 11.5px; color: var(--ink-2); }

.members { list-style: none; margin: 0; padding: 0; }
.members li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 14.5px;
}
.members li:last-child { border-bottom: 0; }
.members li > span:first-child { flex: 1; }

.fee { margin: 0 0 6px; }

/* ------------------------------------------------------------------ 탭바 */

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  background: var(--paper-2);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar__btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 9px 4px;
  border: 0;
  background: none;
  font-family: inherit;
  font-size: 11px;
  color: var(--ink-2);
  cursor: pointer;
}
.tabbar__icon { font-size: 19px; line-height: 1.2; filter: grayscale(1); opacity: .55; }
.tabbar__btn.is-active { color: var(--brick); font-weight: 700; }
.tabbar__btn.is-active .tabbar__icon { filter: none; opacity: 1; }

/* ------------------------------------------------------------------ 토스트 / 모달 */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom));
  transform: translate(-50%, 14px);
  z-index: 60;
  max-width: min(92vw, 460px);
  padding: 12px 18px;
  border-radius: 999px;
  background: rgba(44, 35, 32, .94);
  color: #fff;
  font-size: 13.5px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast--error { background: #8c2f26; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(44, 35, 32, .45);
}
.modal__panel {
  width: 100%;
  max-width: 360px;
  background: var(--paper-2);
  border-radius: var(--radius);
  padding: 22px;
}
.modal__msg { margin: 0 0 18px; font-size: 14.5px; }
.modal__actions { display: flex; gap: 8px; }
.modal__actions .btn { flex: 1; }

/* ------------------------------------------------------------------ 관리자 */

.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th, .admin-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}
.admin-table th { background: #f2ece6; font-weight: 500; color: var(--ink-2); }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---- 실측 패널 (?perf=1). 참가자에게는 렌더되지 않는다 — D-030 ---- */
.perf {
  /* 탭바(z-index 20, 화면 맨 아래) **위에** 앉는다.
     그리고 body 에 그만큼 아래 여백을 줘 화면 요소를 가리지 않게 한다 —
     안 그러면 로그인 버튼이 패널에 덮여 **눌리지 않는다**(실제로 테스트가 잡았다). */
  position: fixed; left: 8px; right: 8px;
  bottom: calc(var(--perf-bottom, 8px)); z-index: 120;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: rgba(30, 24, 22, .94); color: #fff;
  font-size: 12px; line-height: 1.5;
  box-shadow: 0 6px 24px rgba(0,0,0,.28);
}
.perf[hidden] { display: none; }
.perf__head { margin: 0 0 6px; font-weight: 700; letter-spacing: .02em; }
.perf__empty { margin: 0; opacity: .7; }
.perf__table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.perf__table th,
.perf__table td { padding: 2px 0; text-align: right; font-weight: 400; white-space: nowrap; }
.perf__table th { text-align: left; font-weight: 700; padding-right: 8px; }
.perf__table tr.is-over { color: #ffb4a2; }
.perf__actions { display: flex; gap: 6px; margin-top: 8px; }
.perf__actions button {
  flex: 1; padding: 6px 8px;
  border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
  background: none; color: #fff; font-family: inherit; font-size: 12px; cursor: pointer;
}
/* 클립보드가 없을 때 쓰는 복사용 임시 요소. 화면에 보이면 안 된다. */
.perf__copy { position: fixed; left: -9999px; top: 0; opacity: 0; }

/* 비활성 회차 탭. 숨기지 않고 **꺼져 있음을 보여 준다** — 운영진은 데이터를 계속 본다 (D-031). */
.tab.is-off { opacity: .55; }
.tab.is-off small {
  display: block; font-size: 10px; letter-spacing: .02em; opacity: .8;
}

</style>

      { start: '12:40', end: '13:30', title: '점심식사', place: 'PL교회 인근', note: '조별 이동/식사' },
      { start: '13:30', end: '14:00', title: '이동 (노량진역 → 시청역)', place: '지하철 1호선', note: '약 30분' },
      { start: '14:00', end: '16:10', title: '정동 답사', place: '정동 일대', note: '조별 배정 코스 순서대로' },
      { start: '16:25', end: '17:00', title: '마무리 모임 — 소감 나눔', place: '인근 카페', note: '' }
    ],
    '11/07(토)': [
      { start: '13:00', end: '13:30', title: '당일 세부일정 OT', place: 'PL교회', note: '등록 & 이름표 배부' },
      { start: '13:30', end: '14:00', title: '이동 (노량진역 → 시청역)', place: '지하철 1호선', note: '약 30분' },
      { start: '14:00', end: '16:10', title: '정동 답사', place: '정동 일대', note: '조별 배정 코스 순서대로' },
      { start: '16:25', end: '17:00', title: '마무리 모임 — 소감 나눔', place: '인근 카페', note: '' }
    ]
  };

  var NOTICES = [
    { id: 'N1', target: '전체', title: '점심 도시락 안내', pinned: true,
      body: '도시락은 조별로 한 번에 받습니다. 조장이 인원수를 확인해 주세요.', publishedAt: '2026-10-20T09:00:00+09:00' },
    { id: 'N2', target: '10/31(토)', title: '교통카드 지참', pinned: false,
      body: '지하철 이동이 있습니다. 교통카드를 꼭 챙겨 주세요.', publishedAt: '2026-10-19T09:00:00+09:00' }
  ];

  // ---- 사람 / 조 -------------------------------------------------------
  var PEOPLE = {
    leader: {
      participant: { id: 'P0002', name: '김캠티', audience: '청년부', session: '10/31(토)',
                     role: '조장', group: '1조', feeStatus: '완납', insurance: '가입완료' },
      team: { session: '10/31(토)', group: '1조', name: '1조 배재', color: '#984534',
              leaderName: '김캠티', meetingPoint: 'PL교회 본당 앞',
              course: 'C코스(보구여관 시작)', route: ['CP3', 'CP4', 'CP1', 'CP2'] },
      isLeader: true, isAdmin: false,
      members: [
        { id: 'P0002', name: '김캠티', role: '조장', feeStatus: '완납', insurance: '가입완료' },
        { id: 'P0001', name: '이승천', role: '일반', feeStatus: '미납', insurance: '미가입' },
        { id: 'P0007', name: '한지민', role: '일반', feeStatus: '완납', insurance: '가입완료' },
        { id: 'P0008', name: '오세훈', role: '일반', feeStatus: '완납', insurance: '가입완료' }
      ]
    },
    member: {
      participant: { id: 'P0001', name: '이승천', audience: '청년부', session: '10/31(토)',
                     role: '일반', group: '1조', feeStatus: '미납', insurance: '미가입' },
      team: { session: '10/31(토)', group: '1조', name: '1조 배재', color: '#984534',
              leaderName: '김캠티', meetingPoint: 'PL교회 본당 앞',
              course: 'C코스(보구여관 시작)', route: ['CP3', 'CP4', 'CP1', 'CP2'] },
      isLeader: false, isAdmin: false,
      members: []
    }
  };

  function persona() {
    try { return sessionStorage.getItem('demo_persona') || 'leader'; } catch (e) { return 'leader'; }
  }
  function me() { return PEOPLE[persona()] || PEOPLE.leader; }

  // ---- 가변 상태 -------------------------------------------------------
  var progress = [
    { checkpoint: 'CP3', visitOrder: 1, status: '완료', arrivedAt: '2026-10-31T14:00:00+09:00',
      completedAt: '2026-10-31T14:24:00+09:00', score: 9, memo: '' },
    { checkpoint: 'CP4', visitOrder: 2, status: '도착', arrivedAt: '2026-10-31T14:36:00+09:00',
      completedAt: '', score: null, memo: '' },
    { checkpoint: 'CP1', visitOrder: 3, status: '대기', arrivedAt: '', completedAt: '', score: null, memo: '' },
    { checkpoint: 'CP2', visitOrder: 4, status: '대기', arrivedAt: '', completedAt: '', score: null, memo: '' }
  ];

  var seq = 100;
  var journals = [
    { id: 'J0001', session: '10/31(토)', group: '1조', authorId: 'P0007', authorName: '한지민',
      checkpoint: 'CP3', text: '보구여관 터 표석 앞에서. 병원이 있던 자리라는 걸 안내판을 보고서야 알았다.\n이름의 뜻이 "여성을 널리 구제한다"라는 게 오래 남는다.',
      photoUrl: '', status: '승인', rejectReason: '',
      createdAt: '2026-10-31T14:20:00+09:00', updatedAt: '' },
    { id: 'J0002', session: '10/31(토)', group: '1조', authorId: 'P0008', authorName: '오세훈',
      checkpoint: 'CP4', text: '심슨기념관 계단. 학생 한 명으로 시작했다는 이야기가 계속 맴돈다.',
      photoUrl: '', status: '승인', rejectReason: '',
      createdAt: '2026-10-31T14:52:00+09:00', updatedAt: '' },
    { id: 'J0003', session: '10/31(토)', group: '2조', authorId: 'P0011', authorName: '박서준',
      checkpoint: 'CP1', text: '배재학당 교훈을 찾았다. 欲爲大者 當爲人役 — 크고자 하거든 남을 섬기라.',
      photoUrl: '', status: '승인', rejectReason: '',
      createdAt: '2026-10-31T14:05:00+09:00', updatedAt: '' },
    { id: 'J0004', session: '10/31(토)', group: '3조', authorId: 'P0015', authorName: '최유나',
      checkpoint: 'CP2', text: '킹스로드를 걸으며. 고종이 걸었던 길이라는 게 실감이 안 난다.',
      photoUrl: '', status: '대기', rejectReason: '',
      createdAt: '2026-10-31T15:10:00+09:00', updatedAt: '' }
  ];

  function decorate(j) {
    var m = me();
    var mine = j.authorId === m.participant.id;
    var sameTeam = j.session === m.participant.session && j.group === m.participant.group;
    return Object.assign({}, j, {
      isMine: mine,
      canEdit: mine || (m.isLeader && sameTeam)
    });
  }

  function galleryList() {
    var m = me();
    return journals
      .filter(function (j) { return j.status !== '삭제'; })
      .filter(function (j) { return j.status === '승인' || j.authorId === m.participant.id; })
      .filter(function (j) { return j.session === m.participant.session; })
      .map(decorate);
  }

  // ---- 라우팅 ----------------------------------------------------------
  function handle(body) {
    switch (body.action) {
      case 'bootstrap':
        return { config: CONFIG, labels: LABELS, sessions: SESSIONS, checkpoints: CHECKPOINTS,
                 notices: NOTICES, timeline: TIMELINE, serverTime: '2026-10-31T14:40:00+09:00' };

      case 'auth.login': {
        var m = me();
        if (String(body.phoneLast4 || '').length !== 4) {
          return { __error: { code: 'BAD_REQUEST', message: '연락처 뒷 4자리를 입력해 주세요.' } };
        }
        return { token: 'demo-token', expiresAt: '',
                 me: Object.assign({}, m, { sessionCorrected: false }) };
      }

      case 'me': return Object.assign({}, me(), { isAdmin: false });

      case 'progress.list': return progress;

      case 'progress.set':
        if (!me().isLeader) return { __error: { code: 'FORBIDDEN', message: '조장만 기록할 수 있습니다.' } };
        progress = progress.map(function (p) {
          if (p.checkpoint !== body.checkpoint) return p;
          var now = '2026-10-31T15:0' + (seq++ % 10) + ':00+09:00';
          return Object.assign({}, p, {
            status: body.status,
            arrivedAt: body.status === '대기' ? '' : (p.arrivedAt || now),
            completedAt: body.status === '완료' ? (p.completedAt || now) : (body.status === '대기' ? '' : p.completedAt)
          });
        });
        return progress;

      case 'journal.list': {
        var m2 = me();
        var items;
        if (body.scope === 'mine') {
          items = journals.filter(function (j) { return j.authorId === m2.participant.id && j.status !== '삭제'; }).map(decorate);
        } else if (body.scope === 'team') {
          if (!m2.isLeader) return { __error: { code: 'FORBIDDEN', message: '조장만 볼 수 있습니다.' } };
          items = journals.filter(function (j) {
            return j.group === m2.participant.group && j.session === m2.participant.session && j.status !== '삭제';
          }).map(decorate);
        } else {
          items = galleryList();
        }
        return { items: items, total: items.length, nextCursor: null,
                 galleryScope: CONFIG.GALLERY_SCOPE, requiresApproval: CONFIG.JOURNAL_REQUIRE_APPROVAL };
      }

      case 'journal.create': {
        var m3 = me();
        if (!body.text && !body.photo) {
          return { __error: { code: 'BAD_REQUEST', message: '소감이나 사진 중 하나는 있어야 합니다.' } };
        }
        var created = {
          id: 'J' + (++seq), session: m3.participant.session, group: m3.participant.group,
          authorId: m3.participant.id, authorName: m3.participant.name,
          checkpoint: body.checkpoint || '', text: body.text || '',
          photoUrl: body.photo ? ('data:' + body.photo.mimeType + ';base64,' + body.photo.dataBase64) : '',
          status: CONFIG.JOURNAL_REQUIRE_APPROVAL ? '대기' : '승인', rejectReason: '',
          createdAt: '2026-10-31T15:30:00+09:00', updatedAt: ''
        };
        journals = [created].concat(journals);
        return decorate(created);
      }

      case 'journal.update': {
        var target = journals.filter(function (j) { return j.id === body.id; })[0];
        if (!target) return { __error: { code: 'NOT_FOUND', message: '해당 일지를 찾을 수 없습니다.' } };
        if (!decorate(target).canEdit) {
          return { __error: { code: 'FORBIDDEN', message: '본인 또는 조장, 관리자만 수정할 수 있습니다.' } };
        }
        if (body.text !== undefined) target.text = body.text;
        if (body.checkpoint !== undefined) target.checkpoint = body.checkpoint;
        if (body.removePhoto) target.photoUrl = '';
        if (body.photo) target.photoUrl = 'data:' + body.photo.mimeType + ';base64,' + body.photo.dataBase64;
        if (!target.text && !target.photoUrl) {
          return { __error: { code: 'BAD_REQUEST', message: '소감이나 사진 중 하나는 남겨야 합니다.' } };
        }
        if (CONFIG.JOURNAL_REQUIRE_APPROVAL && target.status === '승인') target.status = '대기';
        return decorate(target);
      }

      case 'journal.delete':
        journals = journals.filter(function (j) { return j.id !== body.id; });
        return { id: body.id, status: '삭제' };

      case 'fee.status': {
        var m4 = me();
        return { me: { status: m4.participant.feeStatus }, members: m4.isLeader
          ? m4.members.map(function (x) { return { id: x.id, name: x.name, status: x.feeStatus }; })
          : [] };
      }

      // ---- 관리자 --------------------------------------------------------
      case 'admin.login':
        if (String(body.pin) !== '000000') {
